<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday, Javah ❤️</title>
  <meta name="description" content="A birthday surprise for Javah from Anu.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #050505;
      --soft-black: #0b090a;
      --maroon: #5c0f1b;
      --deep-maroon: #300810;
      --wine: #7e1d2d;
      --cream: #f5e9df;
      --muted: #b9a9aa;
      --line: rgba(177, 73, 91, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--cream);
      font-family: "Montserrat", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(126, 29, 45, 0.10),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(92, 15, 27, 0.08),
          transparent 30%
        );
    }

    /* Responsive image container */
    .image-section {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: clamp(15px, 4vw, 50px);
    }

    .birthday-image {
      display: block;

      width: min(100%, 1000px);
      height: auto;

      max-width: 100%;

      object-fit: contain;

      border-radius: 8px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(126, 29, 45, 0.15);
    }

    /* Tablet */
    @media (max-width: 800px) {
      .image-section {
        min-height: auto;
        padding: 25px 18px;
      }

      .birthday-image {
        width: 100%;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .image-section {
        padding: 15px 10px;
      }

      .birthday-image {
        width: 100%;
        border-radius: 5px;
      }
    }
  </style>
</head>

<body>

  <main class="image-section">
    <img
      src="image/Your paragraph text_20260930_141153_0000.png"
      alt="Birthday surprise for Javah"
      class="birthday-image"
    >
  </main>

</body>
</html>
